name: Build for GPU

inputs:
  name:
    description: Name of target
    type: string
    required: true
  env:
    description: Environment for the build
    type: string
    required: true
  meson_args:
    description: Meson arguments for the build
    type: string
    required: true
  unittests:
    description: Unittests
    type: string
    required: true

runs:
  using: composite
  steps:
    - name: setup environment
      shell: bash
      run: printf '%s\n' ${{ inputs.env }} | tee -a ${GITHUB_ENV}
    - name: Install distro packages
      shell: bash
      run: |
        DEBIAN_SNAPSHOT=20260818T000000Z
        printf 'deb [trusted=yes check-valid-until=no] http://snapshot.debian.org/archive/debian/%s/ sid main\n' "${DEBIAN_SNAPSHOT}" >/etc/apt/sources.list.d/debian-snapshot.list
        printf 'Acquire::Check-Valid-Until "false";\n' >/etc/apt/apt.conf.d/99snapshot
        DEBIAN_FRONTEND=noninteractive apt-get -y update
        echo "::group::Installing build dependencies"
        DEBIAN_FRONTEND=noninteractive apt-get -y install \
            bats \
            ca-certificates \
            ${CC-g++} \
            elfutils \
            file \
            gawk \
            git \
            jq \
            libboost-dev \
            libeigen3-dev \
            libgtest-dev \
            libhwloc-dev \
            libssl-dev \
            libzstd-dev \
            meson \
            ninja-build \
            python3-yaml \
            yq \
            zlib1g-dev \
            libze1=1.28.2-2 \
            libze-dev=1.28.2-2 \
            intel-ocloc=26.05.37020.3-1 \
            libigdfcl2=2.28.4-4 \
            libigc2=2.28.4-4
        echo "::endgroup::"
    - uses: actions/checkout@v6
    - name: meson setup
      shell: bash
      run: meson setup builddir -Ddevice_type=gpu -Dbuildtype=debugoptimized ${{ inputs.meson_args }}
    - name: ninja build
      shell: bash
      run: ninja -C builddir
    - uses: actions/upload-artifact@v4
      with:
        name: linux-${{ inputs.name }}-binary-gpu
        path: builddir/opendcdiag
        retention-days: 3
    - name: confirm opendcdiag runs
      shell: bash
      run: |
        builddir/opendcdiag --version
    - name: ninja build unittests
      if: ${{ inputs.unittests }}
      shell: bash
      run: ninja -C builddir unittests
