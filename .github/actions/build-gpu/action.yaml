name: Build for GPU

inputs:
  name:
    description: Name of target
    type: string
    required: true
  env:
    description: Environment for the build
    type: string
    required: true
  meson_args:
    description: Meson arguments for the build
    type: string
    required: true
  unittests:
    description: Unittests
    type: string
    required: true

runs:
  using: composite
  steps:
    - name: setup environment
      shell: bash
      run: printf '%s\n' ${{ inputs.env }} | tee -a ${GITHUB_ENV}
    - name: Install distro packages
      shell: bash
      run: |
        DEBIAN_FRONTEND=noninteractive apt-get -y update
        DEBIAN_FRONTEND=noninteractive apt-get -y install ca-certificates gpg software-properties-common wget
        add-apt-repository -y ppa:ubuntu-toolchain-r/test
        install -d -m 0755 /etc/apt/keyrings
        wget -qO - https://repositories.intel.com/gpu/intel-graphics.key | gpg --dearmor --yes -o /etc/apt/keyrings/intel-graphics.gpg
        printf 'deb [arch=amd64 signed-by=/etc/apt/keyrings/intel-graphics.gpg] https://repositories.intel.com/gpu/ubuntu noble unified\n' >/etc/apt/sources.list.d/intel-gpu.list
        DEBIAN_FRONTEND=noninteractive apt-get -y update
        echo "::group::Installing build dependencies"
        DEBIAN_FRONTEND=noninteractive apt-get -y install \
            bats \
            ca-certificates \
            ${CXX:-g++} \
            elfutils \
            file \
            gawk \
            git \
            jq \
            libboost-dev \
            libeigen3-dev \
            libgtest-dev \
            libhwloc-dev \
            libssl-dev \
            libzstd-dev \
            meson \
            ninja-build \
            python3-yaml \
            yq \
            zlib1g-dev \
            libze1 \
            libze-dev \
            intel-ocloc \
            libigdfcl2 \
            libigc2
        echo "::endgroup::"
    - uses: actions/checkout@v6
    - name: meson setup
      shell: bash
      run: meson setup builddir -Ddevice_type=gpu -Dbuildtype=debugoptimized ${{ inputs.meson_args }}
    - name: ninja build
      shell: bash
      run: ninja -C builddir
    - uses: actions/upload-artifact@v4
      with:
        name: linux-${{ inputs.name }}-binary-gpu
        path: builddir/opendcdiag
        retention-days: 3
    - name: confirm opendcdiag runs
      shell: bash
      run: |
        builddir/opendcdiag --version
    - name: ninja build unittests
      if: ${{ inputs.unittests }}
      shell: bash
      run: ninja -C builddir unittests
